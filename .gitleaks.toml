# Gitleaks configuration for DRM sample project
# This project intentionally contains demo DRM tokens for testing purposes

title = "DoveRunner DRM Sample Gitleaks Config"

[allowlist]
description = "Demo DRM tokens and URLs for sample code"
paths = [
    '''shared/js/doverunner-base-helper\.js''',
    '''shared/js/doverunner-hardware-drm-helper\.js'''
]
regexes = [
    '''eyJ[A-Za-z0-9_-]+\.?[A-Za-z0-9_-]*\.?[A-Za-z0-9_-]*''',
    '''drm-contents\.doverunner\.com''',
    '''drm-license\.doverunner\.com'''
]
