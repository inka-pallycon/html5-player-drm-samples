<!DOCTYPE html>
<html>

<head>
    <title>VideoJS Doverunner Multi-DRM Sample</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link rel="stylesheet" href="../../../css/mvp.css">
    <link rel="stylesheet" href="../../../css/scrolldown.css">

    <!-- VideoJS library and css -->
    <script src="https://vjs.zencdn.net/8.3.0/video.js"></script>
    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/videojs-contrib-eme@5.5.1/dist/videojs-contrib-eme.js"></script>
</head>

<body>
    <header>
        <h1>Doverunner - VideoJS Sample</h1>
        <img alt="videojs logo" src="../../../media/videojs-logo.png">

        <p>This sample shows how to use the VideoJS player to play HLS content protected by FairPlay DRM with license renewal.</p>
        <p>
            <a href="https://doverunner.com/docs/content-security/multi-drm/clients/html5-player/" target="_blank"><i>Doverunner Docs
                    &nearr;</i></a>
            <a href="https://docs.videojs.com/index.html" target="_blank"><b>Visit VideoJS docs &nearr;</b></a>
        </p>
        <!-- Scroll down indicator CSS animation -->
        <div class="container">
            <div class="chevron"></div>
            <div class="chevron"></div>
            <div class="chevron"></div>
          </div>        
    </header>
    <main>
        <hr>
        <code id="browserCheckResult"></code>
        <p>
            <video id="my-player" class="video-js vjs-default-skin vjs-16-9" controls data-setup="{}">
            </video>
        </p>
    </main>
    <footer>
        <p align="center">Copyright 2025 <a href="https://doverunner.com/" target="_blank">Doverunner</a></p>
    </footer>
</body>

<script type="text/javascript" src="../../../js/doverunner-sample-helper.js"></script>
<script type="text/javascript" src="./videojs-fairplay-renewal-sample.js"></script>

</html>
